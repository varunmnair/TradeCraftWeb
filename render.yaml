# TradeCraftWeb - Render Free Tier Deployment
#
# GitHub:
# https://github.com/varunmnair/TradeCraftWeb
#
# IMPORTANT:
# Free-tier SQLite storage is temporary.
# Database changes will be lost after restart,
# redeployment or service spin-down.

services:
  - type: web
    name: tradecraftweb
    runtime: docker
    region: oregon
    plan: free
    numInstances: 1

    dockerfilePath: ./Dockerfile

    autoDeployTrigger: off

    healthCheckPath: /ready

    envVars:

      # Application mode
      - key: APP_MODE
        value: prod

      # Security
      - key: ALLOW_INSECURE_TOKENS
        value: "0"

      - key: JWT_SECRET
        sync: false

      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Temporary SQLite database
      - key: DATABASE_URL
        value: sqlite:////app/data/tradecraftx.db

      # Production cookie security
      - key: COOKIE_SECURE
        value: "1"

      # Application origin
      - key: CORS_ALLOWED_ORIGINS
        value: https://tradecraftweb.onrender.com

      # Mobile OAuth return
      - key: OAUTH_FRONTEND_ORIGIN
        value: https://tradecraftweb.onrender.com

      # Upstox
      - key: UPSTOX_API_KEY
        sync: false

      - key: UPSTOX_API_SECRET
        sync: false

      - key: UPSTOX_REDIRECT_URI
        value: https://tradecraftweb.onrender.com/brokers/upstox/callback

      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false

      # Zerodha
      - key: KITE_API_KEY
        sync: false

      - key: KITE_API_SECRET
        sync: false

      - key: KITE_REDIRECT_URI
        value: https://tradecraftweb.onrender.com/brokers/zerodha/callback

      # Optional admin initialization
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # Optional AI integrations
      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false