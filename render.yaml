# TradeCraftX Deployment Configuration for Render
# Docs: https://render.com/docs/yaml
#
# Secrets are intentionally marked with `sync: false`; supply them in the
# Render Dashboard when the Blueprint is applied. Never commit secret values.

services:
  - type: web
    name: tradecraftx
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready

    # SQLite is persisted on this disk. The mount path must match DATABASE_URL.
    # A persistent disk requires a paid plan and supports only one instance.
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 5

    envVars:
      # Application mode
      - key: APP_MODE
        value: prod

      # Production security
      - key: ALLOW_INSECURE_TOKENS
        value: "0"

      - key: JWT_SECRET
        sync: false

      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Database: absolute SQLite path under the persistent disk mount.
      - key: DATABASE_URL
        value: sqlite:////app/data/tradecraftx.db

      # The built UI is served by the API on the same origin. Keep CORS exact
      # rather than using a wildcard with credentialed requests.
      - key: CORS_ALLOWED_ORIGINS
        value: https://tradecraftx.onrender.com

      # Mobile OAuth returns to /broker-connections on this origin.
      - key: OAUTH_FRONTEND_ORIGIN
        value: https://tradecraftx.onrender.com

      # Upstox credentials and exact registered callback URL.
      - key: UPSTOX_API_KEY
        sync: false

      - key: UPSTOX_API_SECRET
        sync: false

      - key: UPSTOX_REDIRECT_URI
        value: https://tradecraftx.onrender.com/brokers/upstox/callback

      # Long-lived read-only analytics token used for CMP/OHLCV data.
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false

      # Zerodha credentials and exact registered callback URL.
      - key: KITE_API_KEY
        sync: false

      - key: KITE_API_SECRET
        sync: false

      - key: KITE_REDIRECT_URI
        value: https://tradecraftx.onrender.com/brokers/zerodha/callback

      # Optional: promotes/creates the first admin on startup.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # Optional AI providers.
      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false